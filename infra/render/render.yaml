# Free trial on Render: SQLite, wiped on every restart or deploy.
# Render → New → Blueprint → this repo. For real clinic use, set DATABASE_URL and the SUPABASE_* keys instead.
services:
  - type: web
    name: dictate-trial
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/seed_demo.py && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CLINIC_TZ
        value: Asia/Kolkata
      - key: SEED_DEMO             # 1: load the psychiatry demo clinic (invented people) on start; 0: start empty
        value: "1"
      - key: DEEPGRAM_API_KEY      # optional: live dictation
        sync: false
      - key: GEMINI_API_KEY        # optional: AI notes
        sync: false
